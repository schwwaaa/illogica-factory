        * {
            box-sizing: border-box;
        }

        html {
            background: var(--ink);
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--slime);
            background:
                radial-gradient(circle at 12% 10%, rgba(0, 254, 127, 0.10), transparent 26rem),
                radial-gradient(circle at 89% 18%, rgba(141, 27, 142, 0.10), transparent 24rem),
                linear-gradient(180deg, #030504 0%, #070b08 46%, #020302 100%);
            font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
            letter-spacing: 0.02em;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 90;
        }

        body::before {
            opacity: 0.17;
            mix-blend-mode: screen;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent 0 3px,
                    rgba(104, 255, 130, 0.035) 3px 4px
                );
        }

        body::after {
            background:
                radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, 0.62) 100%);
        }

        a {
            color: inherit;
        }

        .site-shell {
            position: relative;
            z-index: 1;
            width: min(1600px, calc(100% - 28px));

    <script>

            "https://www.youtube.com/embed/hSj5mxRnCJ4"
        ];

        const gridContainer = document.getElementById("gridContainer");

        videoUrls.forEach((url, index) => {
            const item = document.createElement("article");
            item.className = "grid-item";

            const feedBar = document.createElement("div");
            feedBar.className = "feed-bar";

            const feedId = document.createElement("span");
            feedId.className = "feed-id";
            feedId.textContent = `feed ${String(index + 1).padStart(2, "0")}`;

            const feedState = document.createElement("span");
            feedState.className = "feed-state";
            feedState.textContent = "active";

            const frame = document.createElement("div");
            frame.className = "video-frame";

            const iframe = document.createElement("iframe");
            iframe.src = url;
            iframe.title = `illogica factory video ${index + 1}`;
            iframe.loading = index === 0 ? "eager" : "lazy";
            iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
            iframe.referrerPolicy = "strict-origin-when-cross-origin";
            iframe.allowFullscreen = true;

            feedBar.append(feedId, feedState);
            frame.appendChild(iframe);
            item.append(feedBar, frame);
            gridContainer.appendChild(item);
        });
